<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>愷樂生醫 · Premium Hero（GABA鈣鎂晶凍）</title>
<meta name="description" content="愷樂生醫 GABA鈣鎂晶凍 — 一夜好眠，從晶凍開始。純素、幾乎無糖、晶凍劑型好入口。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="assets/img/products/gaba/gaba-box.jpg" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* ════════════════════════════════════════════════════════════════════
   愷樂生醫 — Premium Hero Banner（靜態版：原生 HTML/CSS/JS，可直接上線）
   ● 8 個獨立圖層，皆用 CSS Transform / opacity（GPU 加速），無 GIF / Video / Canvas
   ● 產品海報 = 原圖，固定不變形（僅淡入）；動效全部在周圍的程式圖層
   ● 支援 RWD、prefers-reduced-motion、滑鼠視差、捲動縮放
   ════════════════════════════════════════════════════════════════════ */
:root{
  --wine:#7A1024; --wine-deep:#5C0A1B; --gold:#C8A24D; --gold-soft:#E0C079;
  --cream:#F6EFDC; --ivory:#FBF6EA; --ink:#33262A;
  --mx:0; --my:0; --sp:0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.khero{position:relative;width:100%;min-height:100svh;min-height:100vh;overflow:hidden;isolation:isolate;display:flex;align-items:center;
  background:radial-gradient(120% 90% at 78% 18%, #FFFDF6 0%, var(--ivory) 34%, var(--cream) 68%, #F0E6CC 100%)}
.khero::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(180deg,transparent 62%,rgba(240,230,204,.55) 100%)}

/* LAYER 1 · 背景暖色晨光 */
.k-l1{position:absolute;inset:-8%;z-index:1;pointer-events:none;
  background:radial-gradient(38% 46% at 80% 12%,rgba(255,247,225,.95),rgba(255,247,225,0) 70%),radial-gradient(50% 55% at 88% 30%,rgba(200,162,77,.16),rgba(200,162,77,0) 70%);
  transform:translate3d(calc(var(--mx)*-14px),calc(var(--my)*-10px),0) scale(calc(1 + var(--sp)*.12));transition:transform .5s cubic-bezier(.22,.61,.36,1);will-change:transform}
/* LAYER 2 · 窗光斜射（緩慢掃過） */
.k-l2{position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.7;
  background:linear-gradient(115deg,transparent 34%,rgba(255,249,232,.55) 48%,rgba(255,241,206,.28) 56%,transparent 68%);
  transform:translate3d(calc(var(--mx)*-26px),calc(var(--my)*-14px),0);animation:l2sweep 19s ease-in-out infinite;will-change:transform,opacity}
@keyframes l2sweep{0%{transform:translate3d(-16%,0,0);opacity:.35}50%{transform:translate3d(10%,0,0);opacity:.75}100%{transform:translate3d(-16%,0,0);opacity:.35}}
/* LAYER 3 · 植物光暈（呼應海報綠意，極輕微晃動） */
.k-l3{position:absolute;z-index:3;pointer-events:none;filter:blur(42px);opacity:.5;width:44vmax;height:44vmax;left:-10vmax;bottom:-12vmax;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(120,150,86,.30),rgba(120,150,86,0) 62%);
  transform:translate3d(calc(var(--mx)*18px),calc(var(--my)*12px),0);animation:l3sway 14s ease-in-out infinite alternate;will-change:transform}
.k-l3.r{left:auto;right:-14vmax;bottom:2vmax;width:36vmax;height:36vmax;opacity:.36;animation-delay:-5s;background:radial-gradient(circle at 60% 40%,rgba(150,168,110,.26),rgba(150,168,110,0) 62%)}
@keyframes l3sway{from{transform:translate3d(calc(var(--mx)*18px),0,0) rotate(-1.2deg)}to{transform:translate3d(calc(var(--mx)*18px),0,0) rotate(1.2deg)}}
/* LAYER 4 · 微塵 */
.k-l4{position:absolute;inset:0;z-index:4;pointer-events:none;transform:translate3d(calc(var(--mx)*10px),calc(var(--my)*8px),0)}
.k-l4 i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.9),rgba(255,244,214,0) 70%);opacity:0;animation:mote linear infinite;will-change:transform,opacity}
@keyframes mote{0%{opacity:0;transform:translateY(14px) scale(.6)}14%{opacity:.55}86%{opacity:.5}100%{opacity:0;transform:translateY(-70px) scale(1)}}

.k-wrap{position:relative;z-index:7;width:100%;max-width:1320px;margin:0 auto;padding:132px clamp(22px,5vw,72px) 84px;
  display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:clamp(20px,4vw,56px);align-items:stretch;
  transform:scale(calc(1 - var(--sp)*.06));opacity:calc(1 - var(--sp)*.9);transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .5s linear}

.k-copy{align-self:center;display:flex;flex-direction:column;max-width:560px}
.k-logo{width:186px;height:auto;margin-bottom:clamp(22px,3.4vw,40px)}
.k-eyebrow{font-size:clamp(11px,1vw,13px);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:18px}
.k-eyebrow::before{content:"";display:inline-block;width:26px;height:1px;background:var(--gold);vertical-align:middle;margin-right:12px;transform:translateY(-3px)}
.k-title{font-family:"Noto Serif TC",serif;font-weight:700;color:var(--wine);font-size:clamp(2.7rem,5.4vw,4.4rem);line-height:1.1;letter-spacing:.01em;margin-bottom:22px}
.k-title .nw{white-space:nowrap}
.k-sub{font-size:clamp(1.05rem,1.5vw,1.4rem);color:rgba(51,38,42,.82);line-height:1.7;margin-bottom:14px;font-weight:500;text-wrap:balance}
.k-desc{font-size:clamp(.9rem,1.1vw,1rem);color:rgba(51,38,42,.56);line-height:1.85;margin-bottom:clamp(30px,3.6vw,44px);max-width:30em;text-wrap:pretty}
.k-cta{display:flex;flex-wrap:wrap;gap:14px}
.k-btn{position:relative;display:inline-flex;align-items:center;gap:.5em;padding:15px 34px;border-radius:999px;font-size:clamp(.92rem,1.05vw,1.02rem);font-weight:700;text-decoration:none;cursor:pointer;letter-spacing:.02em;transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s ease,background .3s ease,color .3s ease;will-change:transform}
.k-btn-primary{background:linear-gradient(135deg,var(--wine),var(--wine-deep));color:#fbeede;box-shadow:0 14px 30px -14px rgba(122,16,36,.6),inset 0 0 0 1px rgba(224,192,121,.25)}
.k-btn-primary:hover{transform:translateY(-2px) scale(1.035);box-shadow:0 22px 44px -14px rgba(122,16,36,.66),inset 0 0 0 1px rgba(224,192,121,.5)}
.k-btn-primary .a{transition:transform .35s}.k-btn-primary:hover .a{transform:translateX(4px)}
.k-btn-ghost{background:rgba(255,255,255,.5);color:var(--wine);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1.5px rgba(122,16,36,.28)}
.k-btn-ghost:hover{transform:translateY(-2px) scale(1.035);background:rgba(255,255,255,.85);box-shadow:0 16px 32px -16px rgba(51,38,42,.35),inset 0 0 0 1.5px rgba(122,16,36,.5)}

/* LAYER 5 · 產品層（海報 100% 原圖，固定不變形，僅淡入） */
.k-stage{position:relative;align-self:end;justify-self:center;width:100%;max-width:560px;display:flex;justify-content:center;align-items:flex-end}
.k-product{position:relative;width:100%;filter:drop-shadow(0 40px 60px rgba(90,40,20,.24));opacity:0;animation:prodIn 1.15s cubic-bezier(.2,.7,.25,1) .15s forwards}
@keyframes prodIn{from{opacity:0}to{opacity:1}}
.k-product img{display:block;width:100%;height:auto;border-radius:26px;border:1px solid rgba(200,162,77,.28)}
.k-gloss{position:absolute;inset:0;border-radius:26px;overflow:hidden;pointer-events:none;z-index:2}
.k-gloss::before{content:"";position:absolute;top:-30%;left:-60%;width:55%;height:160%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.05) 40%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.05) 60%,transparent);transform:skewX(-14deg);animation:gloss 7.5s cubic-bezier(.5,0,.2,1) infinite;mix-blend-mode:soft-light;will-change:transform}
@keyframes gloss{0%{left:-60%}55%{left:130%}100%{left:130%}}
.k-stage::after{content:"";position:absolute;bottom:-2%;left:50%;transform:translateX(-50%);width:78%;height:34px;background:radial-gradient(50% 100% at 50% 0,rgba(90,40,20,.22),transparent 72%);filter:blur(9px);z-index:-1}

.k-scroll{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:7px;color:rgba(122,16,36,.5);opacity:calc(1 - var(--sp)*1.6)}
.k-scroll span{font-size:10px;letter-spacing:.22em;text-transform:uppercase}
.k-scroll svg{width:20px;height:20px;animation:bob 1.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

.rise{opacity:0;transform:translateY(20px);animation:rise .9s cubic-bezier(.2,.7,.25,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.27s}.d4{animation-delay:.38s}.d5{animation-delay:.5s}
@keyframes rise{to{opacity:1;transform:none}}

@media (max-width:900px){
  .k-wrap{grid-template-columns:1fr;padding:118px 24px 96px;gap:6px}
  .k-copy{align-self:auto;text-align:center;align-items:center;order:1}
  .k-eyebrow::before{display:none}
  .k-cta{justify-content:center}
  .k-stage{order:2;align-self:center;margin-top:20px;max-width:420px}
  .k-desc{display:none}
}
@media (prefers-reduced-motion:reduce){
  .k-l1,.k-l2,.k-l3,.k-l4 i,.k-gloss::before,.k-scroll svg{animation:none!important}
  .rise,.k-product{animation:none!important;opacity:1!important;transform:none!important}
  .k-l1,.k-l2,.k-l3,.k-l4,.k-wrap{transform:none!important}
}
</style>
</head>
<body>
<section class="khero" id="khero" aria-label="愷樂生醫 GABA鈣鎂晶凍">
  <div class="k-l1"></div>                            <!-- Layer 1 背景 -->
  <div class="k-l2"></div>                            <!-- Layer 2 窗光 -->
  <div class="k-l3"></div><div class="k-l3 r"></div>  <!-- Layer 3 植物光暈 -->
  <div class="k-l4" id="kmotes"></div>                <!-- Layer 4 微塵 -->

  <div class="k-wrap">
    <div class="k-copy">
      <img class="k-logo rise d1" src="assets/img/logo.svg" width="186" height="47" alt="愷樂生醫 KAILE BIOMED"><!-- Layer 6 Logo -->
      <p class="k-eyebrow rise d2">GABA · CALCIUM · MAGNESIUM</p>
      <h1 class="k-title rise d2">GABA <span class="nw">鈣鎂晶凍</span></h1><!-- Layer 7 標題 -->
      <p class="k-sub rise d3">一夜好眠 · 從晶凍開始</p>
      <p class="k-desc rise d4">睡前放鬆儀式 × 日常鈣鎂營養補充。純素、幾乎無糖、晶凍劑型好入口——把照顧自己，變成每天的小事。</p>
      <div class="k-cta rise d5"><!-- Layer 8 CTA -->
        <a class="k-btn k-btn-primary" href="gaba.html">立即了解 <span class="a">→</span></a>
        <a class="k-btn k-btn-ghost" href="jelly.html">產品介紹</a>
      </div>
    </div>

    <div class="k-stage"><!-- Layer 5 產品層（固定） -->
      <div class="k-product">
        <img src="assets/img/products/gaba/gaba-box.jpg" width="1086" height="1448"
             alt="愷樂生醫 GABA鈣鎂晶凍 產品包裝" fetchpriority="high" decoding="async">
        <div class="k-gloss"></div>
      </div>
    </div>
  </div>

  <a class="k-scroll" href="#next" aria-label="向下捲動"><span>SCROLL</span>
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
  </a>
</section>

<section id="next" style="min-height:80vh;background:#fff;display:flex;align-items:flex-start;justify-content:center;padding:64px 24px;color:#a99">向下捲動時，Hero 會柔和縮小淡出、背景微微放大（示意內容區）。</section>

<script>
(function(){
  var hero=document.getElementById('khero'), root=document.documentElement;
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var box=document.getElementById('kmotes');
  for(var i=0;i<16;i++){var s=2+Math.random()*4,d=8+Math.random()*10,m=document.createElement('i');
    m.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;top:'+(30+Math.random()*70)+'%;animation-duration:'+d+'s;animation-delay:'+(-Math.random()*d)+'s';box.appendChild(m);}
  if(reduce)return;
  var tx=0,ty=0,cx=0,cy=0,raf;
  hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect();
    tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;if(!raf)raf=requestAnimationFrame(loop);});
  hero.addEventListener('pointerleave',function(){tx=0;ty=0;if(!raf)raf=requestAnimationFrame(loop);});
  function loop(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;root.style.setProperty('--mx',cx.toFixed(3));root.style.setProperty('--my',cy.toFixed(3));
    if(Math.abs(tx-cx)>.001||Math.abs(ty-cy)>.001){raf=requestAnimationFrame(loop);}else{raf=0;}}
  var sraf;addEventListener('scroll',function(){if(sraf)return;sraf=requestAnimationFrame(function(){
    var h=hero.offsetHeight,p=Math.min(1,Math.max(0,scrollY/h));root.style.setProperty('--sp',p.toFixed(3));sraf=0;});},{passive:true});
})();
</script>
</body>
</html>
